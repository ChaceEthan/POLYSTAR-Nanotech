services:
  - type: web
    name: polystar-backend
    runtime: node
    rootDir: polystar-platform
    buildCommand: |
      npm install --include=dev
      npm run build --workspace shared
      npm run build --workspace backend
    startCommand: npm run start --workspace backend
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.x
      - key: APP_NAME
        value: POLYSTAR Platform
      - key: APP_URL
        value: https://www.polystar.rw
      - key: FRONTEND_URL
        value: https://www.polystar.rw
      - key: CLIENT_URL
        value: https://www.polystar.rw
      - key: CORS_ORIGIN
        value: https://www.polystar.rw
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DNS_SERVERS
        value: 8.8.8.8,1.1.1.1
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: MAIL_FROM
        value: info@polystar.rw
      - key: ADMIN_NOTIFICATION_EMAIL
        value: amanipolystar@gmail.com
      - key: CAREERS_EMAIL
        value: careers@polystar.rw
      - key: SMTP_HOST
        value: mail.polystar.rw
      - key: SMTP_PORT
        value: 465
      - key: SMTP_SECURE
        value: true
      - key: SMTP_USER
        value: info@polystar.rw
      - key: SMTP_PASS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: LOG_LEVEL
        value: info
