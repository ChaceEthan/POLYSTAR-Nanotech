services:
  mongodb:
    image: mongo:7
    container_name: polystar-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - polystar-mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: polystar_platform

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: polystar-backend
    restart: unless-stopped
    depends_on:
      - mongodb
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/polystar_platform
      PORT: 5000
    ports:
      - "5000:5000"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: polystar-frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - .env
    ports:
      - "3000:3000"

volumes:
  polystar-mongo-data:
